name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avaliacao_db
          POSTGRES_USER: lccv
          POSTGRES_PASSWORD: lccv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        env:
          DB_NAME: avaliacao_db
          DB_USER: lccv
          DB_PASSWORD: lccv
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          pytest -v --cov=avaliacoes

      - name: Verificar PEP8
        run: |
          pip install flake8
          black .