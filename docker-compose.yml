services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avaliacao_db
      POSTGRES_USER: lccv
      POSTGRES_PASSWORD: lccv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=avaliacao_db
      - DB_USER=lccv
      - DB_PASSWORD=lccv
      - DB_HOST=db
      - DB_PORT=5432

volumes:
  postgres_data: